spring:
  application:
    name: recallops-notification-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/recallops}
      database: ${MONGO_DATABASE:recallops}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

server:
  port: ${PORT:${SERVER_PORT:8085}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  internal-secret: ${INTERNAL_SECRET:}
  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:noreply@recallops.local}
  notification:
    poll-interval-ms: 5000

logging:
  level:
    com.recallops.notification: INFO
    org.springframework.data.mongodb: INFO